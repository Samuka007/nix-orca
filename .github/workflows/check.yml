name: Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check Nix formatting
        run: nix fmt -- --ci flake.nix package.nix

      - name: Check flake on all systems
        run: nix flake check --all-systems

      - name: Build Orca IDE
        run: nix build .#orca-ide

      - name: Smoke-test Orca CLI
        run: timeout 30s ./result/bin/orca-ide --help
